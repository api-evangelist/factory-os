aid: factory-os
name: Factory OS
description: 'Factory OS (styled Factory_OS) is an off-site construction company founded
  in 2017 by Rick Holliday and Larry Pace that industrialized multifamily and affordable
  housing production on an assembly line inside a 275,000-square-foot facility in Building
  680 on Mare Island in Vallejo, California. Union carpenters build wood-frame housing
  modules across roughly two dozen stations in a 33-step process, and the finished modules
  are trucked to the project site and assembled — an approach the company says cuts
  production time by about half and production cost by a quarter against conventional
  site-built construction. It raised roughly $132 million across three rounds, including
  $60 million from JPMorgan Chase and Saint-Gobain in 2021, and delivered more than
  4,000 homes across California and Hawaii, about 90 percent of them affordable housing.
  In May 2024 the company was recapitalized and renamed Harbinger Homes (legal entity
  Harbinger Production Inc.), with Tom Smith as CEO and Kevin Brown as president; factoryos.com
  now 301-redirects every path to harbinger.homes. Harbinger filed a WARN notice on
  12 February 2026 covering all 280 employees, citing a lack of new business and loss
  of capital funding, with layoffs beginning 13 April 2026. Factory OS is a manufacturer
  of physical housing modules, not a software company: it operates no developer program,
  API, SDK, webhook surface or machine-readable specification of any kind, and its GitHub
  organization has no public repositories.'
